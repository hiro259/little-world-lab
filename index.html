<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e7f5ed" />
    <meta name="description" content="参加者のアイデアで育つ小さな3Dワールド。Three.jsとAIのライブ開発体験。" />
    <title>Little World Lab — ちいさな世界の実験室</title>
  </head>
  <body>
    <main id="app" aria-label="Little World Lab">
      <div id="game" aria-label="小さな草原の3Dゲーム"></div>

      <header class="hud hud--top">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand__text">
            <strong>LITTLE WORLD LAB</strong>
            <small>ことばで育つ、ちいさな世界</small>
          </span>
        </div>
        <button class="world-label" id="world-switch" type="button" aria-label="現在WORLD 01 はじまりの草原。クリックでWORLD 02に切り替える" title="クリックしてワールドを切り替える">
          <span class="world-label__dot" aria-hidden="true"></span>
          <span data-world-number>WORLD 01</span>
          <span class="world-label__divider" aria-hidden="true"></span>
          <span class="world-label__name" data-world-name>はじまりの草原</span>
          <span class="world-label__switch" aria-hidden="true">⇄</span>
        </button>
      </header>

      <div id="interaction-hint" class="interaction-hint" aria-live="polite" hidden></div>

      <footer class="hud hud--bottom">
        <details class="control-help" open>
          <summary class="control-help__summary">
            <span class="control-help__expanded">
              <span class="control-help__label">HOW TO MOVE <span>移動する</span></span>
              <span class="control-help__layout">
                <span class="key-row" aria-hidden="true">
                  <span class="keyboard-key">W</span>
                  <span class="key-row__lower">
                    <span class="keyboard-key">A</span>
                    <span class="keyboard-key">S</span>
                    <span class="keyboard-key">D</span>
                  </span>
                </span>
                <span class="control-help__description">
                  <strong>歩いてみよう</strong>
                  <small>矢印キー：移動（通常・POV共通）</small>
                  <small>Shift＋← →：カメラ・視線を左右回転</small>
                  <small>Shift＋↑ ↓：カメラ角度・視線の上下</small>
                  <small>Ctrl：一人称視点（POV）切替／戻す</small>
                  <small>A：キノコ・花を抜く／手放して植える</small>
                  <small>S：持ったものを振る（固有アクション）</small>
                  <small>W・D：今後のアクション用</small>
                </span>
              </span>
              <span class="control-help__hint">クリックで閉じる <span aria-hidden="true">⌄</span></span>
            </span>
            <span class="control-help__collapsed">操作方法 <span aria-hidden="true">⌃</span></span>
          </summary>
        </details>
        <div class="prompt">
          <span class="prompt__sparkle" aria-hidden="true">✦</span>
          <div>
            <strong>この世界に、何を追加しよう？</strong>
            <small>あなたのアイデアが、ここから形になる。</small>
          </div>
        </div>
      </footer>

      <noscript>このゲームを表示するにはJavaScriptを有効にしてください。</noscript>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
